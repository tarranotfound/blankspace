# ╔══════════════════════════════════════╗
# ║          KITTY — MONO lime           ║
# ╚══════════════════════════════════════╝


# ──────────────────────────────────────
# WINDOW
# ──────────────────────────────────────

# Jangan ingat ukuran window sebelumnya
remember_window_size no

# Ukuran awal window
initial_window_width  640
initial_window_height 300

# Padding isi terminal
window_padding_width 10

# Tidak ada decoration/titlebar dari Kitty
hide_window_decorations yes

# Jangan tanya saat menutup window
confirm_os_window_close 0

# Tidak ada rounding
decoration {
    rounding = 0
}






# ──────────────────────────────────────
# FONT
# ──────────────────────────────────────

font_family jetbrains mono
font_size   8.5

bold_font   true
italic_font auto


# ──────────────────────────────────────
# CURSOR
# ──────────────────────────────────────

# Beam / garis vertikal
cursor_shape beam

# 0 = tidak berkedip
cursor_blink_interval 0

# Cursor putih
cursor #F9f9f9

# Warna karakter yang berada di bawah cursor
cursor_text_color #f9f9f9


# ──────────────────────────────────────
# BACKGROUND
# ──────────────────────────────────────

# Background utama
background #1f222d
#background #f9f9f9  light mode

# 1 = solid
# 0.85 = sedikit transparan
# 0.75 = cukup transparan
background_opacity 1


# ──────────────────────────────────────
# TEXT
# ──────────────────────────────────────

# Text utama
foreground #f9f9f9
#foreground #1f222d light mode

# Text URL
url_color #FF8587


# ──────────────────────────────────────
# SELECTION
# ──────────────────────────────────────

# Text ketika di-select
selection_foreground #FFF1F1

# Background ketika di-select
selection_background #2caa2e


# ══════════════════════════════════════
# LIME ANSI PALETTE
# ══════════════════════════════════════

# Normal black
color0 #263326

# Normal lime
color1 #2CAA2E

# Muted dark lime
color2 #347A36

# Muted lime
color3 #459447

# Medium lime
color4 #3E873F

# Dark green
color5 #367738

# Soft lime
color6 #58A95A

# Light text
color7 #DCECDC


# ──────────────────────────────────────
# BRIGHT COLORS
# ──────────────────────────────────────

# Bright black
color8 #526653

# Bright lime
color9 #35C238

# Bright dark-lime
color10 #48A94A

# Bright lime
color11 #5CC85E

# Bright medium-lime
color12 #50B852

# Bright green
color13 #46A948

# Bright soft-lime
color14 #72C974

# Bright white
color15 #EFFFF0

# ══════════════════════════════════════
# TABS
# ══════════════════════════════════════

# Powerline tab bar
tab_bar_style powerline
tab_bar_edge top

# Tab aktif
active_tab_foreground #FFF1F1
active_tab_background #6F292B

# Tab tidak aktif
inactive_tab_foreground #B98586
inactive_tab_background #843335


# ══════════════════════════════════════
# KITTY BEHAVIOR
# ══════════════════════════════════════

# Remote control
allow_remote_control yes

# Audio bell dimatikan
enable_audio_bell no


# ══════════════════════════════════════
# OPTIONAL CONFIG
# ══════════════════════════════════════

# File tambahan kalau masih lo pakai
#include kitty-colors.conf

# Noctalia theme — currently disabled
#include themes/noctalia.conf
